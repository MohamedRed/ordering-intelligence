apiVersion: pubsub.cnrm.cloud.google.com/v1beta1
kind: PubSubSubscription
metadata:
  name: order-events-to-notification
spec:
  topicRef:
    name: orders
  pushConfig:
    pushEndpoint: https://NOTIFICATION_SERVICE_URL/events/orders
    oidcToken:
      serviceAccountEmail: notification-service@PROJECT_ID.iam.gserviceaccount.com
  deadLetterPolicy:
    deadLetterTopicRef:
      name: orders-dlq
    maxDeliveryAttempts: 10
  ackDeadlineSeconds: 20
