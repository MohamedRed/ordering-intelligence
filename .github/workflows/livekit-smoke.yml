name: livekit-smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, staging, prod]
        default: dev

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LiveKit CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/livekit/cli/main/install.sh | bash
          echo "${HOME}/.livekit/bin" >> "$GITHUB_PATH"
      - name: Run smoke (skip if secrets missing)
        env:
          ROOM_NAME: "ci-smoke-${{ inputs.environment }}"
          PARTICIPANT_NAME: "ci-smoke-${{ github.run_id }}"
          SIP_TRUNK: ${{ secrets.SIP_TRUNK_ID }}
          SIP_NUMBER: ${{ secrets.SIP_CALLER_NUMBER }}
        run: |
          if [ -z "$SIP_TRUNK" ] || [ -z "$SIP_NUMBER" ]; then
            echo "SIP secrets missing; skipping smoke"
            exit 0
          fi
          chmod +x backend/services/voice-agent-worker/scripts/livekit-smoke.sh
          backend/services/voice-agent-worker/scripts/livekit-smoke.sh
