name: Temporary Billing Unblock

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  link-liive-dev-billing:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878404493774/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-ci-dev@liive-dev.iam.gserviceaccount.com
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: liive-dev

      - name: Link liive-dev to the last open billing account
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ACCOUNTS < <(gcloud billing accounts list --filter='open=true' --format='value(name)')
          if [ "${#ACCOUNTS[@]}" -eq 0 ]; then
            echo "No open billing accounts are visible to this principal." >&2
            exit 2
          fi
          ACCOUNT_NAME="${ACCOUNTS[$((${#ACCOUNTS[@]} - 1))]}"
          ACCOUNT_ID="${ACCOUNT_NAME##*/}"
          echo "::add-mask::$ACCOUNT_NAME"
          echo "::add-mask::$ACCOUNT_ID"
          gcloud billing projects link liive-dev --billing-account="$ACCOUNT_ID"
          gcloud billing projects describe liive-dev --format='value(billingEnabled)'
          ENABLED="$(gcloud billing projects describe liive-dev --format='value(billingEnabled)')"
          if [ "$ENABLED" != "True" ] && [ "$ENABLED" != "true" ]; then
            echo "Billing did not verify as enabled for liive-dev." >&2
            exit 3
          fi
