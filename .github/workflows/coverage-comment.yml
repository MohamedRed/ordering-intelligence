name: Coverage Summary

on:
  pull_request:
    paths:
      - '.github/workflows/coverage-comment.yml'
      - 'backend/services/menu-ingestion/**'
      - 'backend/services/notification-service/**'
      - 'backend/services/voice-agent-worker/**'
      - 'backend/services/order-service/**'
      - 'backend/services/admin-service/**'
      - 'apps/admin/**'
      - 'apps/business/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-summary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: [self-hosted, linux, x64, liive-dev]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/services/menu-ingestion/package-lock.json
            backend/services/notification-service/package-lock.json
            backend/services/voice-agent-worker/package-lock.json
      - name: Install c8 for parsing
        run: npm install -g c8
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: |
            backend/services/order-service/go.sum
            backend/services/admin-service/go.sum
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('apps/**/pubspec.lock') }}

      - name: Node deps (menu-ingestion)
        working-directory: backend/services/menu-ingestion
        run: npm ci
      - name: Coverage (menu-ingestion)
        id: cov_menu_ingestion
        working-directory: backend/services/menu-ingestion
        run: |
          npm test -- --coverage
          pct=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$pct" >> $GITHUB_OUTPUT

      - name: Node deps (notification-service)
        working-directory: backend/services/notification-service
        run: npm ci
      - name: Coverage (notification-service)
        id: cov_notification
        working-directory: backend/services/notification-service
        run: |
          npm test -- --coverage
          pct=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$pct" >> $GITHUB_OUTPUT

      - name: Node deps (voice-agent-worker)
        working-directory: backend/services/voice-agent-worker
        run: npm ci
      - name: Coverage (voice-agent-worker)
        id: cov_voice_worker
        working-directory: backend/services/voice-agent-worker
        run: |
          C8_REPORT_DIR=coverage npx c8 -r json-summary -r text tsx --test src/runtime/__tests__/*.test.ts
          pct=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.statements.pct)")
          echo "pct=$pct" >> $GITHUB_OUTPUT

      - name: Flutter deps (admin)
        working-directory: apps/admin
        run: flutter pub get
      - name: Coverage (admin Flutter)
        id: cov_admin_flutter
        working-directory: apps/admin
        run: |
          flutter test --coverage
          pct=$(lcov --summary coverage/lcov.info 2>/dev/null | awk '/lines/ {print $4}' | sed 's/%//')
          echo "pct=$pct" >> $GITHUB_OUTPUT

      - name: Flutter deps (business)
        working-directory: apps/business
        run: flutter pub get
      - name: Coverage (business Flutter)
        id: cov_business_flutter
        working-directory: apps/business
        run: |
          flutter test --coverage
          pct=$(lcov --summary coverage/lcov.info 2>/dev/null | awk '/lines/ {print $4}' | sed 's/%//')
          echo "pct=$pct" >> $GITHUB_OUTPUT
      - name: Extract Go coverage
        run: |
          cd backend/services/order-service
          go test -coverprofile=cmd/order-service/coverage.out ./cmd/order-service
          cd ../../../backend/services/admin-service
          go test -coverprofile=cmd/admin-service/coverage.out ./cmd/admin-service
      - name: Summarize coverage
        id: summary
        run: |
          summarize() {
            local path=$1
            if [ -f "$path" ]; then
              total=$(go tool cover -func="$path" | awk '/total:/ {print $3}')
              echo "$total"
            else
              echo "n/a"
            fi
          }
          ORDER=$(summarize backend/services/order-service/cmd/order-service/coverage.out)
          ADMIN=$(summarize backend/services/admin-service/cmd/admin-service/coverage.out)
          MENU_JS=${{ steps.cov_menu_ingestion.outputs.pct }}
          NOTIFY_JS=${{ steps.cov_notification.outputs.pct }}
          VOICE_JS=${{ steps.cov_voice_worker.outputs.pct }}
          ADMIN_FL=${{ steps.cov_admin_flutter.outputs.pct }}
          BUSINESS_FL=${{ steps.cov_business_flutter.outputs.pct }}
          echo "order=$ORDER" >> $GITHUB_OUTPUT
          echo "admin=$ADMIN" >> $GITHUB_OUTPUT
          echo "menu_js=$MENU_JS" >> $GITHUB_OUTPUT
          echo "notify_js=$NOTIFY_JS" >> $GITHUB_OUTPUT
          echo "voice_js=$VOICE_JS" >> $GITHUB_OUTPUT
          echo "admin_fl=$ADMIN_FL" >> $GITHUB_OUTPUT
          echo "business_fl=$BUSINESS_FL" >> $GITHUB_OUTPUT
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            **Coverage summary**
            - order-service (Go): ${{ steps.summary.outputs.order }}
            - admin-service (Go): ${{ steps.summary.outputs.admin }}
            - menu-ingestion (Node): ${{ steps.summary.outputs.menu_js }}%
            - notification-service (Node): ${{ steps.summary.outputs.notify_js }}%
            - voice-agent-worker (Node): ${{ steps.summary.outputs.voice_js }}%
            - admin app (Flutter): ${{ steps.summary.outputs.admin_fl }}%
            - business app (Flutter): ${{ steps.summary.outputs.business_fl }}%
