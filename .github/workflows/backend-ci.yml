name: Backend CI

on:
  push:
    branches:
      - main
      - before-release
      - 'codex/**'
    paths:
      - '.github/workflows/backend-ci.yml'
      - 'backend/**'
      - 'scripts/ci/**'
  pull_request:
    paths:
      - '.github/workflows/backend-ci.yml'
      - 'backend/**'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-packages:
    name: Node.js (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-customization
            path: backend/services/agent-customization
            lint: 'false'
            test: 'true'
          - name: channel-comms
            path: backend/services/channel-comms
            lint: 'false'
            test: 'true'
          - name: menu-ingestion
            path: backend/services/menu-ingestion
            lint: 'false'
            test: 'true'
          - name: notification-service
            path: backend/services/notification-service
            lint: 'true'
            test: 'true'
          - name: onboarding
            path: backend/services/onboarding
            lint: 'false'
            test: 'true'
          - name: payments-service
            path: backend/services/payments-service
            lint: 'false'
            test: 'true'
          - name: pos-export
            path: backend/services/pos-export
            lint: 'false'
            test: 'true'
          - name: voice-agent-config
            path: backend/libs/voice-agent-config
            lint: 'false'
            test: 'true'
          - name: voice-agent-worker
            path: backend/services/voice-agent-worker
            lint: 'false'
            test: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci
      - name: Audit production dependencies
        working-directory: ${{ matrix.path }}
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        if: matrix.lint == 'true'
        working-directory: ${{ matrix.path }}
        run: npm run lint
      - name: Build
        working-directory: ${{ matrix.path }}
        run: npm run build
      - name: Test
        if: matrix.test == 'true'
        working-directory: ${{ matrix.path }}
        run: npm test

  python-packages:
    name: Python shared config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build package
        working-directory: backend/libs/shared/config/python
        run: python -m build
      - name: Install package
        working-directory: backend/libs/shared/config/python
        run: python -m pip install dist/*.whl
      - name: Compile package sources
        working-directory: backend/libs/shared/config/python
        run: python -m compileall config_loader

  go-modules:
    name: Go (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-context
            path: backend/libs/agent-context
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: shared-config
            path: backend/libs/shared/config
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: admin-service
            path: backend/services/admin-service
            coverage_threshold: '10'
            staticcheck: 'true'
          - name: agent-tools
            path: backend/services/agent-tools
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: agent-webhooks
            path: backend/services/agent-webhooks
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: channel-gateway
            path: backend/services/channel-gateway
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: customer-profile-service
            path: backend/services/customer-profile-service
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: delivery-service
            path: backend/services/delivery-service
            coverage_threshold: '0'
            staticcheck: 'false'
          - name: dispatch-service
            path: backend/services/dispatch-service
            coverage_threshold: '0'
            staticcheck: 'false'
          - name: order-service
            path: backend/services/order-service
            coverage_threshold: '4'
            staticcheck: 'false'
          - name: recommendation-service
            path: backend/services/recommendation-service
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: typesense-indexer
            path: backend/services/typesense-indexer
            coverage_threshold: '0'
            staticcheck: 'true'
          - name: wait-time-service
            path: backend/services/wait-time-service
            coverage_threshold: '0'
            staticcheck: 'true'
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: |
            backend/libs/**/go.sum
            backend/services/**/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        if: matrix.staticcheck == 'true'
        run: |
          if ! command -v staticcheck >/dev/null 2>&1; then
            go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          fi
          staticcheck ./...
      - name: Go tests
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage gate
        if: matrix.coverage_threshold != '0'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | sed 's/%//')
          echo "total coverage: $total%"
          awk -v total="$total" -v threshold="${{ matrix.coverage_threshold }}" 'BEGIN { if (total+0 < threshold+0) { exit 1 } }'
