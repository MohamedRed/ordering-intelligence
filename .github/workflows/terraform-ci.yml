name: Terraform CI

on:
  push:
    branches:
      - main
      - before-release
      - 'codex/**'
    paths:
      - '.github/workflows/terraform-ci.yml'
      - 'infra/terraform/**'
      - 'infrastructure/terraform/**'
      - 'ops/security/**'
      - 'scripts/terraform/**'
  pull_request:
    paths:
      - '.github/workflows/terraform-ci.yml'
      - 'infra/terraform/**'
      - 'infrastructure/terraform/**'
      - 'ops/security/**'
      - 'scripts/terraform/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ops/security/package-lock.json
      - name: Security lints
        working-directory: ops/security
        run: |
          npm ci
          npm run lint-cloud-run-overrides
          npm run lint-iam-bindings
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform fmt
        run: |
          terraform -chdir=infrastructure/terraform fmt -check -recursive
          terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate environments
        run: scripts/terraform/validate.sh
