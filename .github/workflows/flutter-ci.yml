name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [business, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce HTTPS usage
        working-directory: ops/security
        run: |
          npm ci
          npm run lint-flutter-https
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.2"
          channel: "stable"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
