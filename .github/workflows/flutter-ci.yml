name: Flutter CI

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [business, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce HTTPS usage
        working-directory: ops/security
        run: |
          npm ci
          npm run lint-flutter-https
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.2"
          channel: "stable"
      - run: flutter pub get
      - run: flutter analyze
      - name: flutter test with coverage gate
        run: |
          flutter test --coverage
          pct=$(lcov --summary coverage/lcov.info 2>/dev/null | awk '/lines/ {print $4}' | sed 's/%//')
          echo "coverage=$pct%"
          threshold=30
          awk -v total="$pct" -v thr="$threshold" 'BEGIN { if (total+0 < thr) { exit 1 } }'
