name: Flutter CI

on:
  push:
    branches:
      - main
      - before-release
      - 'codex/**'
    paths:
      - '.github/workflows/flutter-ci.yml'
      - 'apps/**'
      - 'ops/security/**'
      - 'scripts/ci/**'
  pull_request:
    paths:
      - '.github/workflows/flutter-ci.yml'
      - 'apps/**'
      - 'ops/security/**'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-lints:
    name: Flutter security lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ops/security/package-lock.json
      - name: Enforce HTTPS usage
        working-directory: ops/security
        run: |
          npm ci
          npm run lint-flutter-https

  analyze-test:
    name: Flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: security-lints
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            coverage_threshold: '30'
          - app: business
            coverage_threshold: '30'
          - app: consumer
            coverage_threshold: '0'
          - app: driver
            coverage_threshold: '0'
          - app: telegram-mini
            coverage_threshold: '0'
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('apps/**/pubspec.lock') }}
      - name: Install lcov
        if: matrix.coverage_threshold != '0'
        run: sudo apt-get update && sudo apt-get install -y lcov
      - run: flutter pub get
      - run: flutter analyze
      - name: Flutter test
        run: flutter test --coverage
      - name: Coverage gate
        if: matrix.coverage_threshold != '0'
        run: |
          pct=$(lcov --summary coverage/lcov.info 2>/dev/null | awk '/lines/ {print $4}' | sed 's/%//')
          echo "coverage=$pct%"
          awk -v total="$pct" -v threshold="${{ matrix.coverage_threshold }}" 'BEGIN { if (total+0 < threshold+0) { exit 1 } }'
