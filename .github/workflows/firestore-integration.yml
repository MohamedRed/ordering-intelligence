name: Firestore Emulator Tests

on:
  workflow_dispatch:

jobs:
  order-service-firestore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/order-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 447.0.0"

      - name: Start Firestore emulator
        run: |
          gcloud beta emulators firestore start --host-port=localhost:8080 --quiet &
          echo $! > /tmp/firestore-emulator.pid
          # give emulator a moment to boot
          sleep 5

      - name: Run Go tests against emulator
        env:
          FIRESTORE_PROJECT_ID: emulator-ordering-intelligence
        run: |
          eval "$(gcloud beta emulators firestore env-init)"
          go test ./cmd/order-service -run TestCreateAndFetchOrderWithFirestoreEmulator -count=1

      - name: Stop Firestore emulator
        if: always()
        run: |
          if [ -f /tmp/firestore-emulator.pid ]; then
            kill $(cat /tmp/firestore-emulator.pid) || true
          fi
