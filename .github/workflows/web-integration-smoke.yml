name: Web Integration Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    needs: ui-tests
    runs-on: [self-hosted, linux, x64, liive-dev]
    permissions:
      id-token: write
      contents: read
    env:
      FIREBASE_PROJECT_ID: liive-dev
      FIRESTORE_SUFFIX: ci
      CHANNEL_GATEWAY_BASE_URL: ${{ secrets.CHANNEL_GATEWAY_BASE_URL_LIIVE_DEV }}
      CONSUMER_APP_URL: ${{ needs.ui-tests.outputs.consumer_url }}
      BUSINESS_APP_URL: ${{ needs.ui-tests.outputs.business_url }}
      DRIVER_APP_URL: ${{ needs.ui-tests.outputs.driver_url }}
      ADMIN_APP_URL: ${{ needs.ui-tests.outputs.admin_url }}
      MENU_INGESTION_BASE_URL: https://dev-menu-ingestion.liive.app
      ONBOARDING_BASE_URL: https://dev-onboarding-service.liive.app
      ORDER_SERVICE_BASE_URL: https://dev-order-service.liive.app
      DISPATCH_SERVICE_BASE_URL: https://dev-dispatch-service.liive.app
      DELIVERY_SERVICE_BASE_URL: https://dev-delivery-service.liive.app
      PAYMENTS_SERVICE_BASE_URL: https://dev-payments-service.liive.app
      NOTIFICATION_SERVICE_BASE_URL: https://dev-notification-service.liive.app
      AGENT_WEBHOOKS_BASE_URL: https://dev-agent-webhooks.liive.app
      INTERNAL_DELIVERER_ID: ${{ secrets.GCP_SERVICE_ACCOUNT_LIIVE_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_LIIVE_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_LIIVE_DEV }}
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Load Stripe webhook secret
        run: |
          set -euo pipefail
          SECRET=$(gcloud secrets versions access latest --secret="stripe-payments-webhook-secret" --project "$FIREBASE_PROJECT_ID")
          echo "::add-mask::$SECRET"
          echo "STRIPE_PAYMENTS_WEBHOOK_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('tests/integration/package.json') }}

      - name: Install test deps
        run: npm install --prefix tests/integration

      - name: Seed Firestore test tenant
        run: python3 scripts/seed_test_firestore.py --project "$FIREBASE_PROJECT_ID" --suffix "$FIRESTORE_SUFFIX"

      - name: Run smoke tests
        run: node tests/integration/smoke.mjs

      - name: Run driver onboarding flow test
        run: node tests/integration/driver_onboarding.mjs

      - name: Run driver compliance upload test
        run: node tests/integration/driver_compliance_upload.mjs

      - name: Run business onboarding flow test
        run: node tests/integration/business_onboarding.mjs

      - name: Run merchant onboarding finalize test
        run: node tests/integration/merchant_onboarding_finalize.mjs

      - name: Run onboarding agent create test
        run: node tests/integration/onboarding_agent_create.mjs

      - name: Run mobile session auth test
        run: node tests/integration/mobile_session_start.mjs

      - name: Run channel webapp auth simulation test
        run: node tests/integration/channel_oauth_sim.mjs

      - name: Run menu ingest e2e test
        run: node tests/integration/menu_ingest_e2e.mjs

      - name: Run order flow test
        run: node tests/integration/order_flow.mjs

      - name: Run group order flow test
        run: node tests/integration/group_order_flow.mjs

      - name: Run group order submit flow test
        run: node tests/integration/group_order_submit.mjs

      - name: Run order status lifecycle test
        run: node tests/integration/order_status_lifecycle.mjs

      - name: Run dispatch prewarm test
        run: node tests/integration/dispatch_prewarm.mjs

      - name: Run delivery dispatch test
        run: node tests/integration/delivery_dispatch.mjs

      - name: Run delivery quote test
        run: node tests/integration/delivery_quote.mjs

      - name: Run marketplace status update test
        run: node tests/integration/marketplace_status.mjs

      - name: Run marketplace availability test
        run: node tests/integration/marketplace_availability.mjs

      - name: Run marketplace offer accept test
        run: node tests/integration/marketplace_offer_accept.mjs

      - name: Run payments setup intent test
        run: node tests/integration/payments_setup_intent.mjs

      - name: Run payments refund test
        run: node tests/integration/payments_refund.mjs

      - name: Run payments webhook test
        run: node tests/integration/payments_webhook.mjs

      - name: Run payments signed webhook test
        run: node tests/integration/payments_webhook_signed.mjs

      - name: Run notification events test
        run: node tests/integration/notifications_events.mjs

      - name: Run driver route lifecycle test
        run: node tests/integration/driver_route_lifecycle.mjs

      - name: Run voice conversation init test
        run: node tests/integration/voice_conversation_init.mjs

  ui-tests:
    runs-on: [self-hosted, linux, x64, liive-dev]
    permissions:
      id-token: write
      contents: read
    outputs:
      consumer_url: ${{ steps.deploy_channels.outputs.consumer_url }}
      business_url: ${{ steps.deploy_channels.outputs.business_url }}
      driver_url: ${{ steps.deploy_channels.outputs.driver_url }}
      admin_url: ${{ steps.deploy_channels.outputs.admin_url }}
    env:
      HOME: /home/actions-runner
      FIREBASE_PROJECT_ID: liive-dev
      FIRESTORE_SUFFIX: ci
      CHANNEL_GATEWAY_BASE_URL: ${{ secrets.CHANNEL_GATEWAY_BASE_URL_LIIVE_DEV }}
      ONBOARDING_BASE_URL: https://dev-onboarding-service.liive.app
      ORDER_SERVICE_BASE_URL: https://dev-order-service.liive.app
      DISPATCH_SERVICE_BASE_URL: https://dev-dispatch-service.liive.app
      DELIVERY_SERVICE_BASE_URL: https://dev-delivery-service.liive.app
      PAYMENTS_SERVICE_BASE_URL: https://dev-payments-service.liive.app
      NOTIFICATION_SERVICE_BASE_URL: https://dev-notification-service.liive.app
      INTERNAL_DELIVERER_ID: ${{ secrets.GCP_SERVICE_ACCOUNT_LIIVE_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_LIIVE_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_LIIVE_DEV }}
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('tests/integration/package.json') }}

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/integration/package.json') }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Install UI test deps
        run: |
          npm install --prefix tests/integration
          npx --yes playwright@1.49.0 install --with-deps chromium

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Trust Flutter SDK directory
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Build web apps
        run: |
          set -euo pipefail
          for app in admin business driver consumer; do
            pushd "apps/$app" >/dev/null
            flutter pub get
            flutter build web
            popd >/dev/null
          done

      - name: Ensure Firebase Hosting sites exist
        run: |
          set -euo pipefail
          for site in liive-dev-admin liive-dev-business liive-dev-driver liive-dev-consumer; do
            firebase hosting:sites:create "$site" --project "$FIREBASE_PROJECT_ID" || true
          done

      - name: Deploy preview channels
        id: deploy_channels
        run: |
          set -euo pipefail
          CHANNEL="ci-${GITHUB_SHA::7}"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

          deploy_site () {
            local label=$1
            local dir=$2
            local out=$3
            pushd "$dir" >/dev/null
            if ! firebase hosting:channel:deploy "$CHANNEL" --project "$FIREBASE_PROJECT_ID" --only hosting --json > "$out"; then
              echo "Failed to deploy $label"
              if [ -f "$out" ]; then
                cat "$out"
              fi
              exit 1
            fi
            popd >/dev/null
          }

          deploy_site "admin" "apps/admin" "/tmp/admin.json"
          deploy_site "business" "apps/business" "/tmp/business.json"
          deploy_site "driver" "apps/driver" "/tmp/driver.json"
          deploy_site "consumer" "apps/consumer" "/tmp/consumer.json"

          ADMIN_URL=$(jq -r '.result.urls[0]' /tmp/admin.json)
          BUSINESS_URL=$(jq -r '.result.urls[0]' /tmp/business.json)
          DRIVER_URL=$(jq -r '.result.urls[0]' /tmp/driver.json)
          CONSUMER_URL=$(jq -r '.result.urls[0]' /tmp/consumer.json)

          echo "ADMIN_APP_URL=$ADMIN_URL" >> "$GITHUB_ENV"
          echo "BUSINESS_APP_URL=$BUSINESS_URL" >> "$GITHUB_ENV"
          echo "DRIVER_APP_URL=$DRIVER_URL" >> "$GITHUB_ENV"
          echo "CONSUMER_APP_URL=$CONSUMER_URL" >> "$GITHUB_ENV"

          echo "admin_url=$ADMIN_URL" >> "$GITHUB_OUTPUT"
          echo "business_url=$BUSINESS_URL" >> "$GITHUB_OUTPUT"
          echo "driver_url=$DRIVER_URL" >> "$GITHUB_OUTPUT"
          echo "consumer_url=$CONSUMER_URL" >> "$GITHUB_OUTPUT"

      - name: Run UI flow tests
        run: node tests/integration/ui_flow.mjs

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-artifacts-${{ github.sha }}
          path: tests/integration/artifacts

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-artifacts-${{ github.sha }}
          path: tests/integration/artifacts
